    <section class="panel card" id="settingsPanel" aria-label="Shared practice settings" tabindex="0">
      <div class="section-heading settings-heading">
        <div>
          <p class="eyebrow">MAKE IT YOURS</p>
          <h2>Practice settings</h2>
        </div>
        <p class="settings-hint" id="settingsHint" hidden>Stop playback to change settings.</p>
      </div>

      <div class="setting-grid">
        <section class="setting-group" aria-label="Meter and session">
          <h3><svg class="icon" aria-hidden="true"><use href="./icons/lucide.svg#music-2"></use></svg>Meter &amp; session</h3>
          <div class="field-row">
            <label for="beatsPerBar">Beats per bar</label>
            <select id="beatsPerBar">
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4" selected>4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
            </select>
          </div>
          <div class="field-row toggle-row">
            <label for="timerEnabled"><svg class="icon" aria-hidden="true"><use href="./icons/lucide.svg#timer"></use></svg>Practice timer</label>
            <input type="checkbox" id="timerEnabled" />
          </div>
          <div class="field-row" id="timerFields">
            <label for="timerMinutes">Duration (minutes)</label>
            <input type="number" id="timerMinutes" min="1" max="180" step="1" value="5" inputmode="numeric" />
          </div>
          <div class="field-row toggle-row">
            <label for="countdownEnabled">Count-in</label>
            <input type="checkbox" id="countdownEnabled" />
          </div>
          <div class="field-row" id="countdownFields">
            <label for="countdownBeats">Count-in beats</label>
            <select id="countdownBeats">
              <option value="4" selected>4</option>
              <option value="8">8</option>
            </select>
          </div>
        </section>

        <section class="setting-group" aria-label="Sound and display">
          <h3><svg class="icon" aria-hidden="true"><use href="./icons/lucide.svg#volume-2"></use></svg>Sound &amp; display</h3>
          <div class="field-row">
            <label for="clickTone">Click sound</label>
            <select id="clickTone">
              <option value="soft">Soft</option>
              <option value="classic" selected>Classic</option>
              <option value="bright">Bright</option>
            </select>
          </div>
          <div class="field-row">
            <label for="subdivisions">Subdivision</label>
            <select id="subdivisions">
              <option value="1">Quarter notes</option>
              <option value="2">Eighth notes</option>
              <option value="4">Sixteenth notes</option>
            </select>
          </div>
          <div class="field-row">
            <label for="accentPattern">Accent pattern</label>
            <select id="accentPattern">
              <option value="downbeat">Downbeat</option>
              <option value="backbeat">Backbeat (2 &amp; 4)</option>
              <option value="every">Every beat</option>
              <option value="none">No accents</option>
            </select>
          </div>
          <div class="field-row">
            <label for="volume">Volume</label>
            <div class="range-control">
              <input type="range" id="volume" min="0" max="1" step="0.01" value="0.65" aria-label="Metronome volume" />
              <output id="volumeValue" for="volume">65%</output>
            </div>
          </div>
          <div class="field-row toggle-row">
            <label for="wakeLockEnabled">Keep screen awake</label>
            <input type="checkbox" id="wakeLockEnabled" />
          </div>
          <p class="wake-lock-status" id="wakeLockStatus" aria-live="polite"></p>
        </section>
      </div>

      <details class="history-panel">
        <summary><svg class="icon" aria-hidden="true"><use href="./icons/lucide.svg#history"></use></svg>Recent practice</summary>
        <div class="history-content">
          <p class="history-empty" id="historyEmpty">Completed sessions will appear here on this device.</p>
          <ol class="history-list" id="historyList"></ol>
          <button class="history-clear" id="historyClear" type="button" hidden>
            <svg class="icon" aria-hidden="true"><use href="./icons/lucide.svg#trash-2"></use></svg>
            Clear history
          </button>
        </div>
      </details>

    </section>
