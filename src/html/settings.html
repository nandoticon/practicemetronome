    <section class="panel card" id="settingsPanel" role="tabpanel" aria-labelledby="metronomeTab" tabindex="0">
      <div class="section-heading settings-heading">
        <div>
          <p class="eyebrow">MAKE IT YOURS</p>
          <h2>Practice settings</h2>
        </div>
        <p class="settings-hint" id="settingsHint" hidden>Stop playback to change settings.</p>
      </div>

      <div class="setting-grid">
        <section class="setting-group" aria-label="Meter and session">
          <h3>Meter &amp; session</h3>
          <div class="field-row">
            <label for="beatsPerBar">Beats per bar</label>
            <select id="beatsPerBar">
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4" selected>4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
            </select>
          </div>
          <div class="field-row toggle-row">
            <label for="timerEnabled">Practice timer</label>
            <input type="checkbox" id="timerEnabled" />
          </div>
          <div class="field-row" id="timerFields">
            <label for="timerMinutes">Duration (minutes)</label>
            <input type="number" id="timerMinutes" min="1" max="180" step="1" value="5" inputmode="numeric" />
          </div>
          <div class="field-row toggle-row">
            <label for="countdownEnabled">Count-in</label>
            <input type="checkbox" id="countdownEnabled" />
          </div>
          <div class="field-row" id="countdownFields">
            <label for="countdownBeats">Count-in beats</label>
            <select id="countdownBeats">
              <option value="4" selected>4</option>
              <option value="8">8</option>
            </select>
          </div>
        </section>

        <section class="setting-group" aria-label="Sound and display">
          <h3>Sound &amp; display</h3>
          <div class="field-row">
            <label for="clickTone">Click sound</label>
            <select id="clickTone">
              <option value="soft">Soft</option>
              <option value="classic" selected>Classic</option>
              <option value="bright">Bright</option>
            </select>
          </div>
          <div class="field-row">
            <label for="volume">Volume</label>
            <div class="range-control">
              <input type="range" id="volume" min="0" max="1" step="0.01" value="0.65" aria-label="Metronome volume" />
              <output id="volumeValue" for="volume">65%</output>
            </div>
          </div>
          <div class="field-row toggle-row">
            <label for="wakeLockEnabled">Keep screen awake</label>
            <input type="checkbox" id="wakeLockEnabled" />
          </div>
          <p class="wake-lock-status" id="wakeLockStatus" aria-live="polite"></p>
        </section>
      </div>

      <div class="speedloop-only setting-group speedloop-settings" id="speedloopFields" hidden>
        <h3>Speed Loop</h3>
        <div class="speedloop-inputs">
          <div class="field-row">
            <label for="loopStart">Start BPM</label>
            <input type="number" id="loopStart" min="30" max="300" step="1" value="60" inputmode="numeric" />
          </div>
          <div class="field-row">
            <label for="loopTarget">Target BPM</label>
            <input type="number" id="loopTarget" min="30" max="300" step="1" value="120" inputmode="numeric" />
          </div>
          <div class="field-row">
            <label for="loopMinutes">Ramp duration (min)</label>
            <input type="number" id="loopMinutes" min="1" max="120" step="1" value="10" inputmode="numeric" />
          </div>
          <div class="field-row">
            <label for="loopBars">Bars per tempo change</label>
            <input type="number" id="loopBars" min="1" max="32" step="1" value="4" inputmode="numeric" />
          </div>
        </div>
        <p class="loop-hint" id="loopHint">Ramp duration is approximate; tempo updates every 4 bars.</p>
        <div class="loop-progress" id="loopProgress" hidden>
          <div
            class="progress-track"
            id="progressTrack"
            role="progressbar"
            aria-label="Speed Loop ramp progress"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          ><div class="progress-fill" id="progressFill"></div></div>
          <div class="progress-text" id="progressText">0%</div>
        </div>
      </div>
    </section>
