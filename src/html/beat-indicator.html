    <!-- Beat indicator -->
    <section class="beats card" aria-label="Beat indicator" data-i18n-aria-label="beatIndicator">
      <div class="section-heading">
        <div>
          <p class="eyebrow" data-i18n="yourPulse">YOUR PULSE</p>
          <h2 data-i18n="beatIndicator">Beat indicator</h2>
        </div>
        <div class="meter-badge" id="meterLabel">4/4</div>
      </div>
      <div class="beat-display">
        <div class="beat-row" id="beatRow" role="img" aria-label="Beat indicator" data-i18n-aria-label="beatIndicator"></div>
        <div class="phrase-label" id="phraseLabel" hidden></div>
        <div class="beat-activity">
          <div class="loop-progress" id="loopProgress" hidden>
            <p class="loop-progress-heading" data-i18n="rampProgressHeading">RAMP PROGRESS</p>
            <div class="progress-track" id="progressTrack" role="progressbar" aria-label="Speed Loop ramp progress" data-i18n-aria-label="rampProgress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0%</div>
            <p class="progress-elapsed" id="progressElapsed" aria-live="polite"></p>
          </div>
          <div class="endurance-progress" id="enduranceProgress" hidden>
            <p class="endurance-command" id="enduranceCommand" role="status" aria-live="polite"></p>
            <p class="endurance-stage" id="enduranceStage"></p>
            <div class="endurance-timer">
              <span class="endurance-timer-label" data-i18n="enduranceTimeRemaining">TIME REMAINING</span>
              <span class="endurance-countdown" id="enduranceCountdown" aria-live="off"></span>
            </div>
            <div class="progress-track" id="enduranceProgressTrack" role="progressbar" aria-label="Workout progress" data-i18n-aria-label="workoutProgress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="progress-fill" id="enduranceProgressFill"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="console-actions">
        <button class="btn btn-play" id="playBtn" aria-pressed="false">
          <svg class="play-icon" aria-hidden="true"><use href="./img/lucide.svg#play"></use></svg>
          <svg class="pause-icon" aria-hidden="true"><use href="./img/lucide.svg#stop"></use></svg>
          <span id="playLabel" data-i18n="start">Start</span>
        </button>
        <button class="btn btn-tap" id="tapBtn" aria-label="Tap tempo" data-i18n-aria-label="tapTempo">
          <svg class="icon" aria-hidden="true"><use href="./img/lucide.svg#hand"></use></svg>
          <span data-i18n="tapTempo">Tap Tempo</span>
        </button>
        <div class="status-line" id="statusLine" role="status" aria-live="polite"></div>
      </div>
    </section>
