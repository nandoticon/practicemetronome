    <section class="mode-panel card speedloop-only" id="speedloopFields" role="tabpanel" aria-labelledby="speedloopTab" hidden>
      <div>
        <p class="eyebrow" data-i18n="progressiveTempo">PROGRESSIVE TEMPO</p>
        <h2 data-i18n="speedLoopSetup">Speed Loop setup</h2>
        <p class="mode-description" data-i18n="speedLoopDescription">Build speed in structured phrases. Tempo changes only at the start of each selected bar group.</p>
      </div>
      <div class="setting-group speedloop-settings-group">
        <h3><svg class="icon" aria-hidden="true"><use href="./icons/lucide.svg#activity"></use></svg><span data-i18n="rampSettings">Ramp settings</span></h3>
        <div class="speedloop-inputs">
          <div class="field-row">
            <label for="loopStart" data-i18n="startBpm">Start BPM</label>
            <input type="number" id="loopStart" min="30" max="300" step="1" value="60" inputmode="numeric" />
          </div>
          <div class="field-row">
            <label for="loopTarget" data-i18n="targetBpm">Target BPM</label>
            <input type="number" id="loopTarget" min="30" max="300" step="1" value="120" inputmode="numeric" />
          </div>
          <div class="field-row">
            <label for="loopMinutes" data-i18n="rampDuration">Ramp duration (min)</label>
            <input type="number" id="loopMinutes" min="1" max="120" step="1" value="10" inputmode="numeric" />
          </div>
          <div class="field-row">
            <label for="loopBars" data-i18n="barsPerChange">Bars per tempo change</label>
            <input type="number" id="loopBars" min="1" max="32" step="1" value="4" inputmode="numeric" />
          </div>
        </div>
      </div>
      <p class="loop-hint" id="loopHint"></p>
      <div class="loop-progress" id="loopProgress" hidden>
        <div
          class="progress-track"
          id="progressTrack"
          role="progressbar"
          aria-label="Speed Loop ramp progress"
          data-i18n-aria-label="rampProgress"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        ><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">0%</div>
      </div>
    </section>
