    <section class="mode-panel card endurance-only" id="enduranceFields" role="tabpanel" aria-labelledby="enduranceTab" hidden>
      <div>
        <p class="eyebrow" data-i18n="endurancePractice">ENDURANCE PRACTICE</p>
        <h2 data-i18n="enduranceTitle">Endurance training</h2>
        <p class="mode-description" data-i18n="enduranceDescription">Set a tempo above, then alternate focused practice intervals with timed rests.</p>
      </div>
      <div class="setting-group endurance-settings-group">
        <h3><svg class="icon" aria-hidden="true"><use href="./icons/lucide.svg#timer"></use></svg><span data-i18n="workoutSettings">Workout settings</span></h3>
        <div class="speedloop-inputs endurance-inputs">
          <div class="field-row">
            <label class="icon-label" for="endurancePracticeSeconds"><svg class="icon" aria-hidden="true"><use href="./icons/lucide.svg#clock-3"></use></svg><span data-i18n="practiceDurationSeconds">Practice duration (sec)</span></label>
            <input type="number" id="endurancePracticeSeconds" min="1" max="3600" step="1" value="30" inputmode="numeric" />
          </div>
          <div class="field-row">
            <label class="icon-label" for="enduranceRestSeconds"><svg class="icon" aria-hidden="true"><use href="./icons/lucide.svg#hourglass"></use></svg><span data-i18n="restDurationSeconds">Rest duration (sec)</span></label>
            <input type="number" id="enduranceRestSeconds" min="0" max="3600" step="1" value="30" inputmode="numeric" />
          </div>
          <div class="field-row">
            <label class="icon-label" for="enduranceSessions"><svg class="icon" aria-hidden="true"><use href="./icons/lucide.svg#list-ordered"></use></svg><span data-i18n="numberOfSessions">Number of sessions</span></label>
            <input type="number" id="enduranceSessions" min="1" max="99" step="1" value="4" inputmode="numeric" />
          </div>
        </div>
      </div>
    </section>
