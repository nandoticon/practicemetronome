    <!-- BPM display + slider -->
    <section class="tempo card" aria-label="Tempo" data-i18n-aria-label="tempo">
      <div class="section-heading">
        <div>
          <p class="eyebrow" data-i18n="setYourPace">SET YOUR PACE</p>
          <h2 id="tempoTitle" data-i18n="tempo">Tempo</h2>
        </div>
        <span class="tempo-range">30–300 BPM</span>
      </div>
      <div class="bpm-display">
        <span class="bpm-value" id="bpmValue" aria-live="polite">120</span>
        <span class="bpm-unit">BPM</span>
        <span class="tempo-context" id="loopTempoContext" hidden></span>
      </div>

      <div class="stepper-row" aria-label="Adjust tempo" data-i18n-aria-label="adjustTempo">
        <button class="btn btn-step" id="minus5" aria-label="Decrease 5 BPM" data-i18n-aria-label="decrease5">−5</button>
        <button class="btn btn-step" id="minus1" aria-label="Decrease 1 BPM" data-i18n-aria-label="decrease1">−1</button>
        <button class="btn btn-step" id="plus1" aria-label="Increase 1 BPM" data-i18n-aria-label="increase1">+1</button>
        <button class="btn btn-step" id="plus5" aria-label="Increase 5 BPM" data-i18n-aria-label="increase5">+5</button>
      </div>

      <input
        type="range"
        id="tempoSlider"
        class="slider"
        min="30"
        max="300"
        step="1"
        value="120"
        aria-label="Tempo slider"
        data-i18n-aria-label="tempoSlider"
      />
      <div class="slider-scale" aria-hidden="true">
        <span>30</span><span>300</span>
      </div>
      <p class="keyboard-hint" data-i18n="keyboardHint">↑/↓ adjust · Shift + arrows: ±5 · Space: start/stop · T: tap</p>
    </section>
