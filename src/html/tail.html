  <nav class="sticky-playback" id="stickyPlayback" aria-label="Playback controls" data-i18n-aria-label="playbackControls" hidden>
    <button class="btn btn-play" id="stickyPlayBtn" type="button">
      <svg class="play-icon" aria-hidden="true"><use href="./icons/lucide.svg#play"></use></svg>
      <svg class="pause-icon" aria-hidden="true"><use href="./icons/lucide.svg#pause"></use></svg>
      <span id="stickyPlayLabel" data-i18n="start">Start</span>
    </button>
    <button class="btn btn-tap" id="stickyTapBtn" type="button">
      <svg class="icon" aria-hidden="true"><use href="./icons/lucide.svg#hand"></use></svg>
      <span data-i18n="tapTempo">Tap tempo</span>
    </button>
  </nav>
  <script src="bundle.js"></script>
</body>
</html>
