    <!-- Play / Stop -->
    <section class="transport">
      <button class="btn btn-play" id="playBtn" aria-pressed="false">
        <svg class="play-icon" aria-hidden="true"><use href="./icons/lucide.svg#play"></use></svg>
        <svg class="pause-icon" aria-hidden="true"><use href="./icons/lucide.svg#pause"></use></svg>
        <span id="playLabel" data-i18n="start">Start</span>
      </button>
      <div class="status-line" id="statusLine" role="status" aria-live="polite"></div>
    </section>
